<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COOL COOL CLUB, หน้าเจ้าหน้าที่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F3F5; --surface:#FFFFFF; --surface2:#F7F8FA; --ink:#14161A; --muted:#667085; --line:#E3E5EA; --chip:#EDEFF3;
  --btn:#D3202C; --btn-ink:#FFFFFF; --danger:#B3121C;
  --floor:#DC3A41; --floor2:#BE222C; --floor-deep:#8A141C; --cl:#FFFFFF;
  --warn-bg:#FFF1CC; --warn-ink:#6B4600; --ok-bg:rgba(22,163,74,.12); --ok-ink:#15803D;
  --hl:#FFC21A;
  --shadow:0 1px 2px rgba(20,22,26,.05),0 14px 30px -18px rgba(120,20,28,.35);
  --font-display:'Prompt','Noto Sans Thai',system-ui,sans-serif;
  --font-body:'Noto Sans Thai','Prompt',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1013; --surface:#16191E; --surface2:#1D2127; --ink:#F1F3F6; --muted:#9AA3B2; --line:#2A2F37; --chip:#242932;
    --btn:#FF5C63; --btn-ink:#2B0709; --danger:#FF8A90;
    --floor-deep:#6E1119;
    --warn-bg:#3A2C0C; --warn-ink:#F7D88A; --ok-bg:rgba(74,222,128,.14); --ok-ink:#86EFAC;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1013; --surface:#16191E; --surface2:#1D2127; --ink:#F1F3F6; --muted:#9AA3B2; --line:#2A2F37; --chip:#242932;
  --btn:#FF5C63; --btn-ink:#2B0709; --danger:#FF8A90;
  --floor-deep:#6E1119;
  --warn-bg:#3A2C0C; --warn-ink:#F7D88A; --ok-bg:rgba(74,222,128,.14); --ok-ink:#86EFAC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.7);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.25}
.wrap{max-width:1160px;margin:0 auto;padding:18px 16px 40px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* rank colours: r = pastel, rb = strong */
.r1{background:#D9DDD6;color:#2B332E}
.r2{background:#BFE3C9;color:#12432A}
.r3{background:#BBD9F2;color:#113A5E}
.r4{background:#F6E08B;color:#4C3B00}
.r5{background:#F6C59A;color:#5A2A05}
.r6{background:#DCC8F2;color:#3A1466}
.rb1{--rc:#8A948D}.rb2{--rc:#3FA45B}.rb3{--rc:#2F7FC4}.rb4{--rc:#D9B41E}.rb5{--rc:#E27B22}.rb6{--rc:#7E4FC9}
.tag{font-style:normal;display:inline-block;padding:0 8px;border-radius:999px;font:600 11px/18px var(--font-display);white-space:nowrap}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 15px var(--font-display);flex:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:56px;height:auto;border-radius:8px;flex:none;box-shadow:0 6px 14px -6px rgba(190,34,44,.7)}
.brand h1{font-size:23px;font-weight:700;letter-spacing:.02em}
.brand p{margin:0;font-size:13px;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 12px;font-size:13px;color:var(--muted)}
.stat b{font:600 16px var(--font-display);color:var(--ink)}
.sd{width:8px;height:8px;border-radius:50%;flex:none}
.sd.g{background:#22C55E}.sd.r{background:#EF4444}.sd.a{background:#F59E0B}

/* nav */
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;margin:18px 0 22px}
.nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;border-radius:12px;min-height:46px;padding:6px 4px;font:500 14px var(--font-display);cursor:pointer;color:var(--muted)}
.nav button svg{width:20px;height:20px;flex:none}
.nav button[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}
@media (max-width:719px){
  .nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:0;border-radius:20px;padding:6px;z-index:30;box-shadow:0 10px 30px -8px rgba(0,0,0,.35)}
  .nav button{flex-direction:column;gap:2px;font-size:11.5px;min-height:52px}
  .wrap{padding-bottom:110px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 18px;border-radius:12px;border:1px solid transparent;background:var(--btn);color:var(--btn-ink);font:600 15px var(--font-display);cursor:pointer}
.btn.soft{background:var(--chip);color:var(--ink)}
.btn.wide{width:100%}
.btn:disabled,.mini:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:6px;cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
.link.danger{color:var(--danger)}
.mini{min-height:36px;min-width:36px;padding:4px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.mini.del{color:var(--danger)}
.mini.paid{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.chip{min-height:34px;padding:2px 12px;border-radius:999px;border:0;background:var(--chip);font-size:13px;cursor:pointer;white-space:nowrap}
.chip.st-rest{background:var(--warn-bg);color:var(--warn-ink)}
.chip.st-out{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.chip.on{background:var(--btn);color:var(--btn-ink);cursor:default}
.rsel{min-height:34px;border-radius:999px;border:0;padding:2px 8px;font:600 13px var(--font-display);cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:20px;padding:0 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.live{background:var(--ok-bg);color:var(--ok-ink)}
.pill.draft{background:var(--warn-bg);color:var(--warn-ink)}
.pdot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live .pdot{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* drag */
[data-drag]{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.dragging,body.dragging *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.dragghost{position:fixed;z-index:100;pointer-events:none;display:flex;align-items:center;gap:8px;background:#fff;color:#14161A;border-radius:14px;padding:5px 14px 5px 5px;font:600 14px var(--font-display);box-shadow:0 14px 32px rgba(0,0,0,.4);transform:translate(-50%,-130%);white-space:nowrap}
.dragghost .av{width:30px;height:30px;font-size:13px}
.grip{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted);cursor:grab;background:var(--chip)}

/* dock (mobile queue + selection) */
.dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;padding:8px 0 6px;margin-bottom:8px;background:linear-gradient(var(--bg) 82%,transparent)}
.bench{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bench::-webkit-scrollbar{display:none}
.bchip{flex:none;display:flex;align-items:center;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;scroll-snap-align:start;color:inherit;font:inherit}
.bchip .av{width:32px;height:32px;font-size:14px}
.bchip b{display:block;font:600 13px/1.2 var(--font-display);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bchip small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.bchip[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:0}
.selbar{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 10px 8px 8px;margin-bottom:8px;box-shadow:0 10px 26px -10px rgba(0,0,0,.5);font-size:14px}
.selbar .who{display:flex;align-items:center;gap:10px;min-width:0}
.selbar .av{width:30px;height:30px;font-size:13px}
.selbar .acts{display:flex;gap:6px}
.selbar .mini{background:transparent;color:inherit;border-color:currentColor;min-height:34px}
@media (min-width:1000px){.dock:not(.has-sel){display:none}.bench{display:none}}

/* courts */
.split{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.split{grid-template-columns:minmax(0,1fr) 360px;align-items:start}.queue{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.courts{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.court{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.chead{display:flex;align-items:center;gap:12px;padding:14px 16px 12px}
.cno{width:44px;height:44px;border-radius:14px;background:linear-gradient(160deg,#E23A42,#B21B25);color:#fff;font:700 20px var(--font-display);display:grid;place-items:center;flex:none}
.chead h3{font-size:16px;font-weight:600}
.chead .pill{margin-top:2px}
.timer{margin-left:auto;font:600 22px var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.floor{margin:0 12px;border-radius:18px;background:var(--floor-deep);padding:9px}
.area{position:relative;height:204px;border-radius:9px;background:linear-gradient(160deg,var(--floor),var(--floor2));overflow:hidden}
.area::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 25% 0%,rgba(255,255,255,.16),transparent 60%);pointer-events:none}
.lines{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.lines *{vector-effect:non-scaling-stroke}
.slots{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:1fr 1fr}
.half{display:flex;flex-direction:column;justify-content:space-around;padding:10px 12px;gap:8px;min-width:0}
.half.solo{justify-content:center}
.slot{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:rgba(255,255,255,.97);color:#14161A;border:0;border-radius:14px;padding:5px 8px 5px 5px;min-width:0;font:inherit;box-shadow:0 6px 14px -6px rgba(0,0,0,.45)}
button.slot{cursor:pointer}
.slot .av{width:30px;height:30px;font-size:13px}
.slot .st{min-width:0;flex:1}
.slot b{display:block;font:600 13.5px/1.2 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot small{display:flex;align-items:center;gap:5px;font-size:11px;color:#667085;line-height:1.35;white-space:nowrap}
.slot .tag{font-size:10px;line-height:15px;padding:0 6px}
.slot.ph{background:rgba(255,255,255,.1);border:1.5px dashed rgba(255,255,255,.7);box-shadow:none;color:#fff;padding:6px 10px 6px 6px}
.slot.ph .plus{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.slot.ph b{font-weight:500;font-size:13px;color:rgba(255,255,255,.92)}
.slot.target{outline:3px solid var(--hl);outline-offset:1px}
.slot.over{outline:3px solid var(--hl);outline-offset:1px;background:#fff;color:#14161A}
.slot.over.ph b{color:#14161A}
.slot.sel{outline:3px solid #14161A;outline-offset:1px;box-shadow:0 0 0 6px var(--hl)}
.shrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 12px 0;padding:6px 6px 6px 14px;background:var(--surface2);border-radius:14px;font-size:14px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper output{font:600 18px var(--font-display);min-width:26px;text-align:center}
.cfoot{padding:12px 12px 14px;display:grid;gap:8px}
.cfoot .hint{text-align:center}
.frow{display:flex;gap:8px;flex-wrap:wrap}
.frow .btn{flex:1 1 110px}
.frow .btn.grow{flex:2 1 150px}
.finish{padding:12px 12px 14px;display:grid;gap:10px}
.finish .teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbox{display:grid;gap:8px;align-content:start;background:var(--surface2);border-radius:16px;padding:10px}
.tbox .tl{font-size:12px;color:var(--muted)}
.tbox .tn{font-size:14px;line-height:1.35;min-height:38px;font-weight:500}
.score{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:6px 10px;text-align:center;font:600 20px var(--font-display)}
.finish .center{text-align:center}

/* queue */
.queue{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.qhead h2{font-size:18px;font-weight:600}
.hint{margin:0;color:var(--muted);font-size:13.5px}
.wl{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.wl li{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 8px 8px 10px;border-radius:16px;background:var(--surface2);border:1.5px solid transparent}
.wl li.up{border-color:color-mix(in srgb,var(--btn) 45%,transparent)}
.wl li.sel{border-color:var(--ink)}
.wl .rk{font:500 12px var(--font-display);color:var(--muted);text-align:center}
.pick{display:flex;align-items:center;gap:10px;width:100%;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.ptxt{min-width:0}
.ptxt b{display:block;font:600 14.5px/1.25 var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptxt small{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;font-size:12px;color:var(--muted);margin-top:1px}
.wt{display:inline-block;padding:0 8px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:11.5px;line-height:18px;white-space:nowrap}
.wt[data-lv="1"]{background:var(--warn-bg);color:var(--warn-ink)}
.wt[data-lv="2"]{background:var(--btn);color:var(--btn-ink)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px}
.panel h2{font-size:18px;font-weight:600;margin-bottom:14px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input[type=text],.addrow select,.fld{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:6px 14px}
.addrow input[type=text]{flex:1 1 180px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.legend .tag{font-size:12px;line-height:22px;padding:0 10px}
details{margin-top:14px}
summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:32px}
textarea{width:100%;min-height:110px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:10px 14px;resize:vertical}
.grp{display:flex;align-items:center;gap:8px;margin:20px 0 6px}
.grp:first-of-type{margin-top:4px}
.gdot{width:10px;height:10px;border-radius:50%;background:var(--rc)}
.grp h3{font-size:15px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:16px;background:var(--surface2)}
.pname{display:flex;align-items:center;gap:10px;min-width:0}
.pname b{font:600 15px var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.off .pname{opacity:.55}
.prow .pg{font-size:13px;color:var(--muted);min-width:46px;text-align:right}
@media (max-width:559px){
  .prow{grid-template-columns:minmax(0,1fr) auto auto}
  .prow .pname{grid-column:1 / -1}
  .prow .pg{text-align:left}
}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:right;padding:10px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font:500 13px var(--font-display);color:var(--muted);border-top:0;background:var(--surface2)}
th:first-child,td:first-child{text-align:left}
td .tag{margin-right:8px}
tr.paidrow td{color:var(--muted)}
tfoot td{font:600 15px var(--font-display);background:var(--surface2)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.sum div{background:var(--surface2);border-radius:16px;padding:12px 14px}
.sum div.big{background:var(--btn);color:var(--btn-ink)}
.sum small{display:block;color:var(--muted);font-size:13px}
.sum .big small{color:inherit;opacity:.85}
.sum b{display:block;font:600 21px var(--font-display)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{padding:10px 14px;border-radius:14px;background:var(--surface2);font-size:15px;display:grid;gap:2px}
.hist .when{font-size:13px;color:var(--muted)}
.hist b{font-family:var(--font-display);font-weight:600}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.setrow:first-of-type{border-top:0;padding-top:0}
.setrow .lbl{flex:1 1 230px}
.setrow .lbl small{display:block;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 18px;min-height:40px;cursor:pointer;border-radius:10px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.switch{width:52px;height:30px;border-radius:999px;border:0;background:var(--chip);position:relative;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--btn)}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--btn-ink)}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;width:100%}
.num{min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font:600 16px var(--font-display)}
.num[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.rate{width:120px;text-align:right}
.empty{text-align:center;padding:44px 16px}
.empty .logo{width:112px;margin:0 auto 18px;display:block}
.empty h2{font-size:21px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 20px;max-width:420px}
.empty .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:8px 8px 8px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 24px);display:flex;align-items:center;gap:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
#toast:not(.has-act){padding-right:18px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.show.has-act{pointer-events:auto}
#toast button{border:0;border-radius:999px;background:var(--bg);color:var(--ink);font:600 14px var(--font-display);padding:6px 16px;min-height:34px;cursor:pointer}
@media (min-width:720px){#toast{bottom:28px}}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-top:12px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--btn)}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--surface2)}
.mrow.off{opacity:.6}
.mmain{flex:1;display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.btn.sm{min-height:38px;padding:4px 14px;font-size:14px;flex:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fgrid label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.fgrid .fld{color:var(--ink);font-size:16px}
.editor{border-color:var(--btn)}
.mhist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.mhist li{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--surface2);font-size:14px}
.mhist .m{color:var(--muted);font-size:13px}
.login{max-width:420px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center;box-shadow:var(--shadow)}
.login .logo{width:96px;margin:0 auto 14px;display:block}
.login h1{font-size:22px}
.login p{color:var(--muted);margin:6px 0 18px;font-size:14px}
.login input{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);padding:6px 16px;font-size:18px;text-align:center;letter-spacing:.2em;margin-bottom:12px}
.login .err{color:var(--danger);font-size:14px;min-height:22px;margin:0 0 8px}
a.btn{text-decoration:none}
.sess{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.sess button.row{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;text-align:left;background:var(--surface2);border:1.5px solid transparent;border-radius:16px;padding:12px 14px;cursor:pointer}
.sess button.row[aria-pressed="true"]{border-color:var(--ink)}
.sess .d{font:600 15px var(--font-display)}
.sess .m{font-size:13px;color:var(--muted)}
.sess .t{font:600 16px var(--font-display);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var KEY='cc-cache-v1';
var RK=['หน้าบ้าน','BG','N','S','P','C'];
var ST={in:'พร้อมเล่น',rest:'พัก',out:'กลับแล้ว'};
var NEXT_ST={in:'rest',rest:'out',out:'in'};
var MAX_NO=20;
var GRIP='<svg width="14" height="20" viewBox="0 0 14 20" fill="currentColor" aria-hidden="true"><circle cx="4" cy="4" r="1.6"/><circle cx="10" cy="4" r="1.6"/><circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="4" cy="16" r="1.6"/><circle cx="10" cy="16" r="1.6"/></svg>';
var PLUS='<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 2v10M2 7h10"/></svg>';
var LOGO='<svg class="logo" viewBox="0 0 134 61" aria-hidden="true"><rect width="134" height="61" rx="6" fill="#C62F2A"/><g fill="none" stroke="#fff" stroke-width="2.4"><rect x="6" y="6" width="122" height="49"/><line x1="6" y1="14" x2="128" y2="14"/><line x1="6" y1="47" x2="128" y2="47"/><line x1="67" y1="3" x2="67" y2="58"/><line x1="40" y1="14" x2="40" y2="47"/><line x1="94" y1="14" x2="94" y2="47"/><line x1="6" y1="30.5" x2="40" y2="30.5"/><line x1="94" y1="30.5" x2="128" y2="30.5"/></g></svg>';
function ico(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'}
var ICON={
  courts:ico('<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M12 5v14M3 12h4M17 12h4"/>'),
  players:ico('<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.4.1 4.1 1.6 4.5 4.3"/>'),
  stats:ico('<path d="M5 20V11M12 20V5M19 20v-6"/>'),
  back:ico('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),
  settings:ico('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>')
};

function fresh(){
  return {players:[],courts:[1,2,3,4].map(function(n){return {no:n,m:null,draft:null}}),size:2,balance:true,
    fee:95,shp:26,feeAll:false,shTotal:0,history:[]};
}
function normalize(d){
  d=Object.assign(fresh(),d);
  d.courts.forEach(function(c,i){if(!c.no)c.no=i+1});
  d.players.forEach(function(p){if(p.d===undefined)p.d=(p.w||0)+(p.l||0)});
  return d;
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return null;
    var d=JSON.parse(raw);
    if(!d||!Array.isArray(d.players)||!Array.isArray(d.courts)||!d.courts.length) return null;
    return normalize(d);
  }catch(e){return null}
}
function cache(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){cache();schedulePush()}
var S=load()||fresh();
var ui={tab:'courts',finishing:null,scores:['',''],confirm:null,bulkOpen:false,hf:'',sel:null,loginErr:'',sessions:null,sessId:null,sessDetail:null,pview:'today',mq:'',mHidden:false,medit:null,mdetail:null,confirmM:null,backupInfo:null};
var undoSnap=null;

/* ---------- server sync (SQLite backend) ---------- */
var token=null;
try{token=localStorage.getItem('cc-token')}catch(e){}
var ver=0,synced=false,dirty=false,pushing=false,pushT=null,evSrc=null,pollT=null;
var sync={s:'idle'};
var SYNC_TXT={idle:'กำลังเชื่อมต่อ',saving:'กำลังบันทึก',ok:'ซิงค์แล้ว',offline:'ออฟไลน์',error:'บันทึกไม่สำเร็จ'};
var SYNC_DOT={idle:'a',saving:'a',ok:'g',offline:'r',error:'r'};
function syncHtml(){return '<span class="stat" data-sync><i class="sd '+SYNC_DOT[sync.s]+'"></i>'+SYNC_TXT[sync.s]+'</span>'}
function paint(st){
  sync.s=st;
  var el=document.querySelector('[data-sync]');
  if(el){el.firstChild.className='sd '+SYNC_DOT[st];el.lastChild.textContent=SYNC_TXT[st]}
}
function api(path,opt){
  opt=opt||{};
  opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});
  if(token) opt.headers.Authorization='Bearer '+token;
  return fetch(path,opt);
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function schedulePush(){
  if(!token) return;
  dirty=true;
  clearTimeout(pushT);
  pushT=setTimeout(push,120);
}
function applyRemote(j){
  S=normalize(j.state);
  ver=j.version;dirty=false;undoSnap=null;
  ui.finishing=null;ui.scores=['',''];
  sanitize();cache();render();
}
async function push(){
  if(!token||!synced||!dirty||pushing) return;
  pushing=true;dirty=false;paint('saving');
  var failed=false;
  try{
    var r=await api('/api/state',{method:'PUT',body:JSON.stringify({baseVersion:ver,state:S})});
    if(r.status===401){pushing=false;logout(true);return}
    var j=await r.json();
    if(r.status===409){
      applyRemote(j);paint('ok');
      toast('มีคนอื่นแก้ไขพร้อมกัน โหลดข้อมูลล่าสุดแล้ว');
    }else if(r.ok){
      ver=j.version;paint('ok');
    }else{
      failed=true;dirty=true;paint('error');
    }
  }catch(e){
    failed=true;dirty=true;paint('offline');
  }
  pushing=false;
  if(dirty){clearTimeout(pushT);pushT=setTimeout(push,failed?4000:60)}
}
async function flush(){
  clearTimeout(pushT);
  var n=0;
  while((dirty||pushing)&&n++<60){
    if(!pushing) await push();
    else await sleep(100);
    if(dirty&&!pushing&&sync.s!=='saving') await sleep(150);
  }
  return !dirty&&!pushing;
}
async function pull(first){
  try{
    var r=await api('/api/state');
    if(r.status===401){logout(true);return}
    var j=await r.json();
    if(j.state===null){
      ver=j.version;synced=true;paint('ok');
      if(first) schedulePush();
      return;
    }
    if(!first&&(dirty||pushing)) return;
    applyRemote(j);synced=true;paint('ok');
  }catch(e){paint('offline')}
}
function onVersion(v){
  if(!synced||v<=ver||pushing||dirty) return;
  if(typeof drag!=='undefined'&&drag&&drag.active) return;
  pull(false);
}
function connectEvents(){
  if(evSrc||typeof EventSource==='undefined') return;
  try{
    evSrc=new EventSource('/api/events');
    evSrc.onmessage=function(e){try{onVersion(JSON.parse(e.data).version)}catch(_){}};
  }catch(e){}
}
function startPoll(){
  if(pollT) return;
  pollT=setInterval(async function(){
    if(!token) return;
    try{
      var r=await fetch('/api/version');
      var j=await r.json();
      if(!synced) await pull(true);
      else{onVersion(j.version);if(sync.s==='offline'&&!dirty) paint('ok')}
    }catch(e){paint('offline')}
  },6000);
}
async function login(pin){
  try{
    var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pin})});
    var j={};try{j=await r.json()}catch(_){}
    if(!r.ok){ui.loginErr=j.error||'เข้าสู่ระบบไม่สำเร็จ';render();return}
    token=j.token;
    try{localStorage.setItem('cc-token',token)}catch(e){}
    ui.loginErr='';synced=false;
    render();
    await pull(true);
    connectEvents();startPoll();
  }catch(e){ui.loginErr='เชื่อมต่อเซิร์ฟเวอร์ไม่ได้';render()}
}
function logout(expired){
  token=null;synced=false;dirty=false;
  try{localStorage.removeItem('cc-token');localStorage.removeItem(KEY)}catch(e){}
  if(evSrc){evSrc.close();evSrc=null}
  S=fresh();members=null;ui.medit=null;ui.mdetail=null;ui.backupInfo=null;ui.mq='';ui.sessions=null;ui.sessDetail=null;ui.sessId=null;ui.tab='courts';
  ui.loginErr=expired?'เซสชันหมดอายุ กรุณาใส่ PIN อีกครั้ง':'';
  render();
}
async function boot(){
  render();
  if(!token) return;
  await pull(true);
  connectEvents();startPoll();
}
async function archiveNow(){
  if(!S.history.length&&!S.players.some(function(p){return p.g>0})) return true;
  var ok=await flush();
  if(!ok){toast('ยังบันทึกขึ้นเซิร์ฟเวอร์ไม่สำเร็จ ยังไม่ล้างข้อมูล');return false}
  try{
    var r=await api('/api/archive',{method:'POST',body:'{}'});
    if(!r.ok) throw new Error('archive');
    return true;
  }catch(e){
    toast('บันทึกประวัติรายวันไม่สำเร็จ ยังไม่ล้างข้อมูล');
    return false;
  }
}
function download(blob,name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
function dayLabel(d){
  try{return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}
}
function loadSessions(){
  api('/api/sessions').then(function(r){
    if(r.status===401){logout(true);return null}
    return r.json();
  }).then(function(j){
    if(!j) return;
    ui.sessions=j.sessions||[];
    if(ui.tab==='back') render();
  }).catch(function(){});
}
function sessionsPanel(){
  var list=ui.sessions;
  var body;
  if(list===null) body='<p class="hint">กำลังโหลด...</p>';
  else if(!list.length) body='<p class="hint">ยังไม่มีประวัติ ระบบจะบันทึกให้อัตโนมัติเมื่อกด "เริ่มวันใหม่" ที่แท็บตั้งค่า</p>';
  else body='<ul class="sess">'+list.map(function(x){
    return '<li><button class="row" data-a="sess" data-id="'+x.id+'" aria-pressed="'+(ui.sessId===x.id)+'"><span><span class="d">'+dayLabel(x.day)+'</span><br><span class="m">'+x.players+' คน, '+x.games+' เกม, ลูก '+x.shuttles+' ลูก</span></span>'+
      '<span class="m">'+(x.total>x.paid?'ค้าง '+num(x.total-x.paid):'ครบแล้ว')+'</span><span class="t">'+num(x.total)+'</span></button></li>';
  }).join('')+'</ul>';
  var det='';
  if(ui.sessDetail&&ui.sessDetail.session&&ui.sessDetail.session.id===ui.sessId){
    var d=ui.sessDetail;
    det='<div style="margin-top:16px"><h3 style="font-size:16px;margin-bottom:10px">รายละเอียด '+dayLabel(d.session.day)+'</h3>'+
      '<div class="tablewrap"><table><thead><tr><th>ผู้เล่น</th><th>เกม</th><th>ลูก</th><th>ค่าสนาม</th><th>ค่าลูก</th><th>รวม (บาท)</th><th>สถานะ</th></tr></thead><tbody>'+
      d.players.map(function(p){return '<tr><td>'+esc(p.name)+' <span class="hint">'+esc(p.rank)+'</span></td><td>'+p.games+'</td><td>'+p.shuttles+'</td><td>'+num(p.court_fee)+'</td><td>'+num(p.shuttle_fee)+'</td><td><b>'+num(p.total)+'</b></td><td><button class="mini'+(p.paid?' paid':'')+'" data-a="spaid" data-id="'+p.id+'" data-v="'+(p.paid?0:1)+'">'+(p.paid?'จ่ายแล้ว':'ยังไม่จ่าย')+'</button></td></tr>'}).join('')+
      '</tbody></table></div><div style="margin-top:12px"><button class="btn soft" data-a="csv" data-id="'+d.session.id+'">ดาวน์โหลด CSV</button></div></div>';
  }
  return '<section class="panel"><h2>ประวัติรายวัน</h2>'+body+det+'</section>';
}

/* ---------- members: permanent roster stored in SQLite ---------- */
var members=null;
function memberById(id){return (members||[]).find(function(m){return m.id===id})}
function upsertMember(m){
  if(!members) return;
  var i=members.findIndex(function(x){return x.id===m.id});
  if(i>=0) members[i]=m; else members.push(m);
}
function loadMembers(){
  if(!token) return;
  api('/api/members'+(ui.mHidden?'?hidden=1':'')).then(function(r){
    if(r.status===401){logout(true);return null}
    return r.json();
  }).then(function(j){
    if(!j) return;
    members=j.members||[];
    if(ui.tab==='players') render();
  }).catch(function(){toast('โหลดรายชื่อสมาชิกไม่สำเร็จ')});
}
function loadBackupInfo(){
  api('/api/backup/status').then(function(r){return r.ok?r.json():null}).then(function(j){
    if(j){ui.backupInfo=j;if(ui.tab==='settings')render()}
  }).catch(function(){});
}
function backupLine(){
  var b=ui.backupInfo;
  if(!b) return '';
  if(!b.latest) return 'สำรองอัตโนมัติ: ยังไม่มีไฟล์';
  return 'สำรองอัตโนมัติล่าสุด '+new Date(b.latest.at).toLocaleString('th-TH')+' เก็บย้อนหลัง '+b.keep+' วัน';
}
function checkInMember(m){
  if(S.players.some(function(p){return p.mid===m.id})) return false;
  var same=S.players.find(function(p){return !p.mid&&p.n.toLowerCase()===m.name.toLowerCase()});
  if(same){same.mid=m.id;same.lv=m.rank;return true}
  S.players.push({id:uid(),mid:m.id,n:m.name,lv:m.rank,st:'in',g:0,d:0,w:0,l:0,sh:0,ws:Date.now(),paid:false,pt:{},op:{}});
  return true;
}
function setRank(p,lv){
  p.lv=lv;commit();
  if(p.mid){
    api('/api/members/'+p.mid,{method:'PUT',body:JSON.stringify({rank:lv})}).then(function(r){
      if(!r.ok) throw 0;
      var m=memberById(p.mid);if(m) m.rank=lv;
    }).catch(function(){toast('บันทึกระดับลงรายชื่อสมาชิกไม่สำเร็จ')});
  }
}
function rankFrom(v){
  v=String(v||'').trim();
  if(/^[1-6]$/.test(v)) return +v;
  var i=RK.findIndex(function(x){return x.toLowerCase()===v.toLowerCase()});
  return i>=0?i+1:3;
}
function memberRow(m,here){
  var act=!m.active?'<button class="btn soft sm" data-a="mrestore" data-id="'+m.id+'">กู้คืน</button>':
    (here.has(m.id)?'<span class="chip on">อยู่วันนี้</span>':'<button class="btn sm" data-a="mcheck" data-id="'+m.id+'">เช็กอิน</button>');
  return '<li class="mrow'+(m.active?'':' off')+'"><button class="mmain" data-a="medit" data-id="'+m.id+'" aria-label="แก้ไข '+esc(m.name)+'">'+
    '<span class="av r'+m.rank+'">'+esc(initial(m.name))+'</span><span class="ptxt"><b>'+esc(m.name)+'</b><small>'+rtag(m.rank)+
    (m.visits?'มา '+m.visits+' ครั้ง, '+m.games+' เกม':'ยังไม่มีประวัติ')+
    (m.unpaid>0?' <span class="pill draft">ค้างจ่าย '+num(m.unpaid)+'</span>':'')+(m.active?'':' <span class="pill">ซ่อนอยู่</span>')+'</small></span></button>'+act+'</li>';
}
function memberListHtml(){
  var q=(ui.mq||'').trim().toLowerCase();
  var here=new Set(S.players.map(function(p){return p.mid}).filter(Boolean));
  var list=members.filter(function(m){
    return !q||m.name.toLowerCase().indexOf(q)>=0||(m.phone||'').indexOf(q)>=0;
  }).sort(function(a,b){
    var la=a.last_day||'',lb=b.last_day||'';
    return (b.active-a.active)||(la<lb?1:la>lb?-1:0)||a.name.localeCompare(b.name,'th');
  });
  if(!list.length) return '<p class="hint">'+(q?'ไม่พบสมาชิกที่ตรงกับคำค้น':'ยังไม่มีสมาชิก เพิ่มได้ที่แท็บ "วันนี้" หรือนำเข้ารายชื่อด้านล่าง')+'</p>';
  return '<ul class="plist">'+list.map(function(m){return memberRow(m,here)}).join('')+'</ul>';
}
function memberEditor(){
  var m=memberById(ui.medit);
  if(!m) return '';
  var d=ui.mdetail&&ui.mdetail.member&&ui.mdetail.member.id===m.id?ui.mdetail:null;
  var hist=d?(d.sessions.length?'<ul class="mhist">'+d.sessions.slice(0,10).map(function(s){
    return '<li><span>'+dayLabel(s.day)+'</span><span class="m">'+s.games+' เกม, ลูก '+s.shuttles+'</span><b>'+num(s.total)+'</b><span class="pill'+(s.paid?' live':' draft')+'">'+(s.paid?'จ่ายแล้ว':'ค้างจ่าย')+'</span></li>';
  }).join('')+'</ul>':'<p class="hint">ยังไม่มีประวัติการเล่น</p>'):'<p class="hint">กำลังโหลดประวัติ...</p>';
  var sum=d?'<p class="hint">มาแล้ว '+d.member.visits+' ครั้ง, '+d.member.games+' เกม, ใช้จ่ายรวม '+num(d.member.spent)+' บาท'+(d.member.unpaid>0?', ค้างจ่าย '+num(d.member.unpaid)+' บาท':'')+'</p>':'';
  var danger=ui.confirmM===m.id?
    '<div class="frow"><button class="btn" data-a="mdelperm" data-id="'+m.id+'">ยืนยันลบถาวร</button><button class="btn soft" data-a="mconfirm-no">ยกเลิก</button></div>'+
    '<p class="hint" style="margin-top:8px">ลบชื่อ เบอร์โทร และหมายเหตุออกจากระบบถาวร ประวัติยอดเงินยังอยู่แต่ไม่มีชื่อ กู้คืนไม่ได้</p>':
    '<div class="frow">'+(m.active?'<button class="btn soft" data-a="mhide" data-id="'+m.id+'">ซ่อนสมาชิก (เก็บประวัติไว้)</button>':'')+

  return '<section class="panel editor" id="meditor"><h2>แก้ไขสมาชิก</h2><div class="fgrid">'+

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function fmt(ms){

  var p=function(n){return String(n).padStart(2,'0')};
  return h?h+':'+p(m)+':'+p(r):p(m)+':'+p(r);
}
function waitFmt(ms){

}
function waitLv(ms){var m=Math.floor(Math.max(0,ms)/60000);return m>=20?2:m>=10?1:0}
function waitChip(p,now,short){

  return '<span class="wt" '+(short?'data-short ':'')+'data-since="'+p.ws+'" data-lv="'+waitLv(ms)+'">'+(short?waitShort(ms):'รอ '+waitFmt(ms))+'</span>';
}
function num(n){return Number(n||0).toLocaleString('th-TH')}

/* ---------- queue logic ---------- */
function playingIds(){
  var s=new Set();
  S.courts.forEach(function(c){if(c.m)c.m.t.flat().forEach(function(i){s.add(i)})});
  return s;
}
function draftIds(){
  var s=new Set();
  S.courts.forEach(function(c){if(!c.m&&c.draft)c.draft.forEach(function(id){if(id)s.add(id)})});
  return s;
}
function waiting(){
  var pl=playingIds(),dr=draftIds();
  return S.players.filter(function(p){return p.st==='in'&&!pl.has(p.id)&&!dr.has(p.id)})
    .sort(function(a,b){return a.g-b.g||a.ws-b.ws});
}
function getDraft(c){
  var n=S.size*2;
  if(!c.draft) c.draft=[];
  while(c.draft.length<n) c.draft.push(null);
  return c.draft;
}
function sanitize(){
  var n=S.size*2,pl=playingIds(),seen={};
  S.courts.forEach(function(c){
    if(c.m){c.draft=null;return}
    if(!c.draft) return;
    var d=[];
    for(var k=0;k<n;k++){
      var id=c.draft[k],p=id&&P(id);
      if(p&&p.st==='in'&&!pl.has(id)&&!seen[id]){seen[id]=1;d.push(id)}else d.push(null);
    }
    c.draft=d.some(Boolean)?d:null;
  });
  if(ui.sel){
    var sp=P(ui.sel.pid),ok=!!(sp&&sp.st==='in'&&!pl.has(ui.sel.pid));
    if(ok){
      var f=ui.sel.from;
      if(f){var fc=S.courts[f.i];ok=!!(fc&&fc.draft&&fc.draft[f.k]===ui.sel.pid)}
      else ok=!S.courts.some(function(c){return c.draft&&c.draft.indexOf(ui.sel.pid)>=0});
    }
    if(!ok) ui.sel=null;
  }
}
function combos(arr,k){
  var out=[];
  (function rec(s,c){
    if(c.length===k){out.push(c.slice());return}
    for(var i=s;i<arr.length;i++){c.push(arr[i]);rec(i+1,c);c.pop()}
  })(0,[]);
  return out;
}
function splitsOf(g){
  if(g.length===2) return [[[g[0]],[g[1]]]];
  return [
    [[g[0],g[1]],[g[2],g[3]]],
    [[g[0],g[2]],[g[1],g[3]]],
    [[g[0],g[3]],[g[1],g[2]]]
  ];
}
function cost(sp){
  var c=0;
  sp.forEach(function(team){
    for(var i=0;i<team.length;i++)for(var j=i+1;j<team.length;j++)c+=3*(team[i].pt[team[j].id]||0);
  });
  sp[0].forEach(function(a){sp[1].forEach(function(b){c+=(a.op[b.id]||0)})});
  if(S.balance){
    var sum=function(t){return t.reduce(function(x,p){return x+p.lv},0)};
    c+=Math.abs(sum(sp[0])-sum(sp[1]));
  }
  return c;
}
function chooseMatch(){
  var n=S.size*2,w=waiting();
  if(w.length<n) return null;
  var cut=w[n-1].g;
  var must=w.filter(function(p){return p.g<cut});
  var tie=w.filter(function(p){return p.g===cut}).slice(0,8);
  var need=n-must.length;
  var best=null;
  combos(tie,need).forEach(function(sub){
    var grp=must.concat(sub);
    var pen=sub.reduce(function(s,p){return s+tie.indexOf(p)},0)*0.05;
    splitsOf(grp).forEach(function(sp){
      var c=cost(sp)+pen;
      if(!best||c<best.c)best={c:c,sp:sp};
    });
  });
  return best.sp.map(function(t){return t.map(function(p){return p.id})});
}
function inc(id,k,other,d){
  var p=P(id);if(!p)return;
  p[k][other]=Math.max(0,(p[k][other]||0)+d);
}
function bump(t,d){
  t.flat().forEach(function(id){var p=P(id);if(p)p.g=Math.max(0,p.g+d)});
  t.forEach(function(team){
    for(var i=0;i<team.length;i++)for(var j=i+1;j<team.length;j++){
      inc(team[i],'pt',team[j],d);inc(team[j],'pt',team[i],d);
    }
  });
  t[0].forEach(function(a){t[1].forEach(function(b){inc(a,'op',b,d);inc(b,'op',a,d)})});
}
function begin(ci,t){
  var ws={};
  t.flat().forEach(function(id){ws[id]=P(id).ws});
  S.courts[ci].m={t:t,start:Date.now(),sh:1,ws:ws};
  S.courts[ci].draft=null;
  bump(t,1);
}
function startDraft(ci){
  var c=S.courts[ci],d=getDraft(c),sz=S.size;
  if(d.some(function(x){return !x})) return false;
  begin(ci,[d.slice(0,sz),d.slice(sz)]);
  return true;
}
function fillDraft(ci){
  var c=S.courts[ci],n=S.size*2,d=getDraft(c);
  if(!d.some(Boolean)){
    var m=chooseMatch();
    if(!m){c.draft=null;return false}
    m.flat().forEach(function(id,k){d[k]=id});
    return true;
  }
  var w=waiting(),wi=0,filled=false;
  for(var k=0;k<n;k++){
    if(!d[k]&&w[wi]){d[k]=w[wi++].id;filled=true}
  }
  return filled;
}
function place(pid,ci,k,from){
  var c=S.courts[ci];
  if(!c||c.m) return false;
  var d=getDraft(c),occ=d[k]||null;
  if(from){
    var fc=S.courts[from.i];
    if(!fc||fc.m) return false;
    var fd=getDraft(fc);
    if(fd[from.k]!==pid) return false;
    if(from.i===ci&&from.k===k) return true;
    fd[from.k]=occ;
  }
  d[k]=pid;
  return true;
}
function removeFromDraft(i,k){
  var c=S.courts[i];
  if(c&&c.draft) c.draft[k]=null;
}
/* side: 0 or 1 = winning team, null = finish without recording a winner */
function finish(ci,side){
  var c=S.courts[ci];if(!c||!c.m)return;
  var score=null;
  if(side!==null){
    var a=ui.scores[0].trim(),b=ui.scores[1].trim();
    if(a!==''||b!==''){
      if(a===''||b===''||isNaN(+a)||isNaN(+b)) return toast('กรอกคะแนนให้ครบทั้งสองทีม หรือเว้นว่างทั้งคู่');
      score=[+a,+b];
      if(score[side]<=score[1-side]) return toast('คะแนนของทีมที่ชนะต้องมากกว่าอีกทีม');
    }
  }
  var snap=JSON.stringify(S);
  var t=c.m.t,sh=c.m.sh||1,now=Date.now();
  if(side!==null){
    t[side].forEach(function(id){var p=P(id);if(p)p.w++});
    t[1-side].forEach(function(id){var p=P(id);if(p)p.l++});
  }
  t.flat().forEach(function(id){var p=P(id);if(p){p.d++;p.sh+=sh;p.ws=now}});
  S.shTotal+=sh;
  S.history.unshift({t:now,court:c.no,teams:t.map(function(tm){return tm.map(function(id){var p=P(id);return p?p.n:'?'})}),
    ids:t.flat(),score:score,win:side,sh:sh});
  S.history=S.history.slice(0,500);
  var no=c.no;
  c.m=null;c.draft=null;ui.finishing=null;ui.sel=null;
  commit();
  undoSnap=snap;
  toast('คอร์ท '+no+' ว่างแล้ว',{label:'เลิกทำ',fn:undo});
}
function undo(){
  if(!undoSnap) return toast('เลิกทำไม่ได้แล้ว');
  S=JSON.parse(undoSnap);
  ui.finishing=null;ui.sel=null;
  commit();
  toast('เลิกทำแล้ว คอร์ทกลับมาเล่นต่อ');
}
function feeOf(p){
  var pays=p.g>0||(S.feeAll&&p.st!=='out');
  var court=pays?S.fee:0,shut=p.sh*S.shp;
  return {court:court,shut:shut,total:court+shut};
}

/* ---------- actions ---------- */
function addPlayers(names,lv){
  var have=new Set(S.players.map(function(p){return p.n.toLowerCase()}));
  var added=0,dup=0,now=Date.now();
  names.forEach(function(n){
    n=n.trim();if(!n)return;
    if(have.has(n.toLowerCase())){dup++;return}
    have.add(n.toLowerCase());
    S.players.push({id:uid(),n:n,lv:lv,st:'in',g:0,d:0,w:0,l:0,sh:0,ws:now,paid:false,pt:{},op:{}});
    added++;
  });
  return {added:added,dup:dup};
}
function copyText(txt,okMsg){
  var done=function(){toast(okMsg)};
  var fallback=function(){
    try{
      var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);
      ok?done():toast('คัดลอกไม่ได้ในหน้านี้');
    }catch(e){toast('คัดลอกไม่ได้ในหน้านี้')}
  };
  try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}
}

  slot:function(el){

      var f=ui.sel.from;

      place(ui.sel.pid,ci,k,f);

      ui.sel={pid:d[k],from:{i:ci,k:k}};render();

/* ---------- drag and drop (pointer based, works with mouse and touch) ---------- */
var drag=null,raf=0;
function slotAt(x,y){
  var t=document.elementFromPoint(x,y);
  return t?t.closest('[data-slot]'):null;
}
function setOver(el){
  if(drag.over===el) return;
  if(drag.over) drag.over.classList.remove('over');
  drag.over=el;
  if(el) el.classList.add('over');
}
function scrollTick(){
  if(!drag||!drag.active) return;
  var h=window.innerHeight;
  if(drag.y<80) window.scrollBy(0,-16);
  else if(drag.y>h-80) window.scrollBy(0,16);
  raf=requestAnimationFrame(scrollTick);
}
function endDrag(){
  window.removeEventListener('pointermove',onMove);
  window.removeEventListener('pointerup',onUp);
  window.removeEventListener('pointercancel',onCancel);
  cancelAnimationFrame(raf);
  if(drag){
    if(drag.ghost&&drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
    if(drag.over) drag.over.classList.remove('over');
  }
  document.body.classList.remove('dragging');
}
function onMove(e){
  if(!drag||e.pointerId!==drag.id) return;
  drag.x=e.clientX;drag.y=e.clientY;
  if(!drag.active){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<7) return;
    drag.active=true;
    var p=P(drag.pid),g=document.createElement('div');
    g.className='dragghost';
    g.innerHTML=p?av(p)+'<span>'+esc(p.n)+'</span>':'';
    document.body.appendChild(g);
    drag.ghost=g;
    document.body.classList.add('dragging');
    raf=requestAnimationFrame(scrollTick);
  }
  drag.ghost.style.left=e.clientX+'px';
  drag.ghost.style.top=e.clientY+'px';
  setOver(slotAt(e.clientX,e.clientY));
}
function onUp(e){
  if(!drag||e.pointerId!==drag.id) return;
  var d=drag,wasActive=d.active,target=wasActive?slotAt(e.clientX,e.clientY):null;
  endDrag();
  drag=null;
  if(!wasActive) return;
  suppressUntil=Date.now()+350;
  if(target){
    var q=target.dataset.slot.split(':');
    if(place(d.pid,+q[0],+q[1],d.from)){ui.sel=null;commit();return}
    render();
  }else if(d.from){
    removeFromDraft(d.from.i,d.from.k);
    ui.sel=null;commit();
    toast('เอาออกจากคอร์ทแล้ว');
  }else{
    render();
  }
}
function onCancel(e){
  if(!drag||e.pointerId!==drag.id) return;
  endDrag();drag=null;render();
}
$app.addEventListener('pointerdown',function(e){
  var el=e.target.closest('[data-drag]');
  if(!el||(e.pointerType==='mouse'&&e.button!==0)||drag) return;
  var from=null;
  if(el.dataset.from){var f=el.dataset.from.split(':');from={i:+f[0],k:+f[1]}}
  drag={pid:el.dataset.drag,from:from,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,active:false,id:e.pointerId,ghost:null,over:null};
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onCancel);
});

  var now=Date.now();

    el.dataset.lv=waitLv(ms);
  });
},1000);

boot();
